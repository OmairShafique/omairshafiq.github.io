<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omair Shafiq</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #faf9f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
    }
    .wrap { text-align: center; }
    .rule { width: 40px; height: 1px; background: #9a7530; margin: 1.4rem auto; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 600;
      color: #1c1a17;
      letter-spacing: 0.02em;
    }
    h1 em { font-style: italic; color: #9a7530; }
    p {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7a7060;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Omair <em>Shafiq</em></h1>
    <div class="rule"></div>
    <p>Coming Soon</p>
  </div>
</body>
</html>
